name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── 自動套用新的 Supabase migration（已套用過的會跳過）──
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply new migrations
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: pssdkligdpptgceqkktv
        run: |
          if [ -z "$SB_TOKEN" ]; then
            echo "::warning::未設定 SUPABASE_ACCESS_TOKEN secret，跳過自動 migration（請手動執行 SQL）"
            exit 0
          fi
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql_text() {
            jq -n --arg q "$1" '{query:$q}' > /tmp/body.json
            curl -sf -X POST -H "Authorization: Bearer $SB_TOKEN"                  -H "Content-Type: application/json" "$API" -d @/tmp/body.json
          }
          run_sql_file() {
            jq -n --rawfile q "$1" '{query:$q}' > /tmp/body.json
            curl -sf -X POST -H "Authorization: Bearer $SB_TOKEN"                  -H "Content-Type: application/json" "$API" -d @/tmp/body.json
          }
          run_sql_text "CREATE TABLE IF NOT EXISTS _applied_migrations (name TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT now());" >/dev/null
          applied=$(run_sql_text "SELECT name FROM _applied_migrations" | jq -r '.[].name' || true)
          for f in $(ls supabase/migrations/*.sql | sort); do
            n=$(basename "$f")
            if echo "$applied" | grep -qx "$n"; then
              echo "skip  $n"
            else
              echo "apply $n"
              run_sql_file "$f" >/dev/null
              run_sql_text "INSERT INTO _applied_migrations(name) VALUES ('$n') ON CONFLICT DO NOTHING;" >/dev/null
            fi
          done
          echo "migrations done"

  deploy:
    needs: migrate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inject secrets and version
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          # 主線 index.html 與 例外路線 exp/index.html 都要注入金鑰與版次
          for f in index.html exp/index.html; do
            [ -f "$f" ] || continue
            python3 -c 'import os,sys; f=sys.argv[1]; sha=sys.argv[2]; su=os.environ.get("SUPABASE_URL","MISSING_URL"); sk=os.environ.get("SUPABASE_ANON_KEY","MISSING_KEY"); print("WARNING: Secrets missing! su="+su[:30]+" sk="+sk[:10]) if ("MISSING" in su or "MISSING" in sk) else None; c=open(f,encoding="utf-8").read(); c=c.replace("__APP_VERSION__",sha).replace("https://YOUR_PROJECT_REF.supabase.co",su).replace("YOUR_ANON_KEY_HERE",sk); open(f,"w",encoding="utf-8").write(c); print("OK "+f+" sha="+sha+" url="+su[:40])' "$f" "$SHA"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
