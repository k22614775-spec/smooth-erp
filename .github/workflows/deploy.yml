name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets and version
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          python3 -c '
import os, sys
f = "index.html"
sha = sys.argv[1]
su  = os.environ.get("SUPABASE_URL",    "MISSING_URL")
sk  = os.environ.get("SUPABASE_ANON_KEY","MISSING_KEY")
if "MISSING" in su or "MISSING" in sk:
    print("WARNING: Secrets are missing! su=" + su[:30] + " sk=" + sk[:10])
c = open(f, encoding="utf-8").read()
c = c.replace("__APP_VERSION__", sha)
c = c.replace("https://YOUR_PROJECT_REF.supabase.co", su)
c = c.replace("YOUR_ANON_KEY_HERE", sk)
open(f, "w", encoding="utf-8").write(c)
print("OK sha=" + sha + " url=" + su[:40])
' "$SHA"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
