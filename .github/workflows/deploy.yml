name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 把 Supabase 金鑰從 GitHub Secrets 注入 index.html
      # 在 GitHub Repo > Settings > Secrets and variables > Actions 設定:
      #   SUPABASE_URL       = https://YOUR_PROJECT_REF.supabase.co
      #   SUPABASE_ANON_KEY  = eyJhbG...（anon public key）
      - name: Inject Supabase config
        run: |
          sed -i "s|https://YOUR_PROJECT_REF.supabase.co|${{ secrets.SUPABASE_URL }}|g" index.html
          sed -i "s|YOUR_ANON_KEY_HERE|${{ secrets.SUPABASE_ANON_KEY }}|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
