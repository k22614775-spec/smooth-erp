name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── 自動套用新的 Supabase migration（已套用過的會跳過）──
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply new migrations
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning::未設定 SUPABASE_DB_URL secret，跳過自動 migration（請手動執行 SQL）"
            exit 0
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS _applied_migrations (name TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT now());"
          for f in $(ls supabase/migrations/*.sql | sort); do
            n=$(basename "$f")
            if psql "$DB_URL" -tAc "SELECT 1 FROM _applied_migrations WHERE name='$n'" | grep -q 1; then
              echo "skip  $n"
            else
              echo "apply $n"
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
              psql "$DB_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO _applied_migrations(name) VALUES ('$n') ON CONFLICT DO NOTHING;"
            fi
          done
          echo "✅ migrations 完成"

  deploy:
    needs: migrate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets and version
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          python3 -c 'import os,sys; f="index.html"; sha=sys.argv[1]; su=os.environ.get("SUPABASE_URL","MISSING_URL"); sk=os.environ.get("SUPABASE_ANON_KEY","MISSING_KEY"); print("WARNING: Secrets missing! su="+su[:30]+" sk="+sk[:10]) if ("MISSING" in su or "MISSING" in sk) else None; c=open(f,encoding="utf-8").read(); c=c.replace("__APP_VERSION__",sha).replace("https://YOUR_PROJECT_REF.supabase.co",su).replace("YOUR_ANON_KEY_HERE",sk); open(f,"w",encoding="utf-8").write(c); print("OK sha="+sha+" url="+su[:40])' "$SHA"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
