name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 把 Supabase 金鑰從 GitHub Secrets 注入 index.html
      # 在 GitHub Repo > Settings > Secrets and variables > Actions 設定:
      #   SUPABASE_URL       = https://YOUR_PROJECT_REF.supabase.co
      #   SUPABASE_ANON_KEY  = eyJhbG...（anon public key）
      # 注入正確的 commit sha 到版次徽章（確保頁面右上角版次 = GitHub 上的 commit sha）
      - name: Inject version sha
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/var APP_VERSION = '[0-9a-f]*'/var APP_VERSION = '${SHA}'/g" index.html
          sed -i "s/>v[0-9a-f]*</>v${SHA}</g" index.html

      # 把 Supabase 金鑰從 GitHub Secrets 注入 index.html
      # 在 GitHub Repo > Settings > Secrets and variables > Actions 設定:
      #   SUPABASE_URL 