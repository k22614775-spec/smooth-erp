name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets and version
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          python3 - << PYEOF
import os
sha = "$SHA"
url = os.environ["SUPABASE_URL"]
key = os.environ["SUPABASE_ANON_KEY"]
content = open("index.html", "r", encoding="utf-8").read()
content = content.replace("__APP_VERSION__", sha)
content = content.replace("https://YOUR_PROJECT_REF.supabase.co", url)
content = content.replace("YOUR_ANON_KEY_HERE", key)
open("index.html", "w", encoding="utf-8").write(content)
print(f"SHA={sha}, URL={url[:30]}..., KEY={key[:20]}...")
PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
